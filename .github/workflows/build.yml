name: Build IPA & Release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | grep -vi candidate | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate 4K textures, normal maps, effects and sounds
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset

          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024",
                "filename" : "icon_1024.png"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          python3 -m venv .venv
          ./.venv/bin/pip install --quiet numpy || ./.venv/bin/pip install --quiet numpy
          export PYTHONIOENCODING=utf-8
          cat << 'EOF' > gen_assets.py
          import numpy as np, zlib, struct, os, math, wave, random, gc
          random.seed(11)

          OUT = os.environ.get("OUT_DIR", "Sources")
          ICON = os.environ.get("ICON_PATH", OUT + "/Assets.xcassets/AppIcon.appiconset/icon_1024.png")
          os.makedirs(OUT, exist_ok=True)
          os.makedirs(os.path.dirname(ICON), exist_ok=True)

          def save_png(path, arr):
              arr = np.ascontiguousarray(arr)
              h, w = arr.shape[:2]
              c = 1 if arr.ndim == 2 else arr.shape[2]
              ctype = {1: 0, 3: 2, 4: 6}[c]
              raw = np.zeros((h, 1 + w * c), dtype=np.uint8)
              raw[:, 1:] = arr.reshape(h, w * c)
              def chunk(t, d):
                  cc = struct.pack('>I', len(d)) + t + d
                  return cc + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, ctype, 0, 0, 0))
              data += chunk(b'IDAT', zlib.compress(raw.tobytes(), 3))
              data += chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(data)

          def out(name):
              return OUT + "/" + name

          def u8(a):
              return np.clip(a * 255.0, 0, 255).astype(np.uint8)

          def hash2(ix, iy, seed):
              n = ix.astype(np.uint32) * np.uint32(374761393)
              n = n + iy.astype(np.uint32) * np.uint32(668265263)
              n = n + np.uint32((seed * 144665) & 0xffffffff)
              n = (n ^ (n >> np.uint32(13))) * np.uint32(1274126177)
              n = n ^ (n >> np.uint32(16))
              return (n & np.uint32(0xffff)).astype(np.float32) / 65535.0

          def vnoise(x, y, px, py, seed):
              xi = np.floor(x).astype(np.int32)
              yi = np.floor(y).astype(np.int32)
              xf = (x - xi).astype(np.float32)
              yf = (y - yi).astype(np.float32)
              x0 = xi % px; x1 = (x0 + 1) % px
              y0 = yi % py; y1 = (y0 + 1) % py
              u = xf * xf * (3 - 2 * xf)
              v = yf * yf * (3 - 2 * yf)
              a = hash2(x0, y0, seed); b = hash2(x1, y0, seed)
              c = hash2(x0, y1, seed); d = hash2(x1, y1, seed)
              return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v

          def fbm(U, V, bx, by, octaves, seed, gain=0.5):
              s = np.zeros_like(U, dtype=np.float32)
              amp = 1.0; tot = 0.0
              px, py = bx, by
              for o in range(octaves):
                  s += amp * vnoise(U * px, V * py, px, py, seed + o * 7)
                  tot += amp
                  px *= 2; py *= 2; amp *= gain
              return s / tot

          def grid(w, h):
              u = (np.arange(w, dtype=np.float32) + 0.5) / w
              v = (np.arange(h, dtype=np.float32) + 0.5) / h
              return np.meshgrid(u, v)

          def smooth(a, b, x):
              t = np.clip((x - a) / (b - a), 0, 1)
              return t * t * (3 - 2 * t)

          def mix(c0, c1, t):
              c0 = np.array(c0, dtype=np.float32); c1 = np.array(c1, dtype=np.float32)
              return c0 + (c1 - c0) * t[..., None]

          def normal_map(hm, strength):
              dx = (np.roll(hm, -1, 1) - np.roll(hm, 1, 1)) * strength
              dy = (np.roll(hm, -1, 0) - np.roll(hm, 1, 0)) * strength
              n = np.stack([-dx, dy, np.ones_like(hm)], axis=-1)
              n /= np.linalg.norm(n, axis=-1, keepdims=True)
              return u8(n * 0.5 + 0.5)

          def make_wood():
              w = h = 4096
              U, V = grid(w, h)
              warp = fbm(U, V, 3, 3, 5, 11)
              rings = 0.5 + 0.5 * np.sin(2 * np.pi * (V * 22 + warp * 6.5 + 0.7 * fbm(U, V, 2, 8, 4, 15)))
              cathedral = (0.5 + 0.5 * np.sin(2 * np.pi * (V * 44 + warp * 12.0))) ** 2
              fibre = fbm(U, V, 8, 256, 4, 5)
              rays = fbm(U, V, 192, 16, 2, 27)
              pores = (fbm(U, V, 160, 24, 2, 9) > 0.67).astype(np.float32)
              t = np.clip(0.16 + 0.44 * rings + 0.16 * cathedral + 0.24 * fibre + 0.08 * (rays - 0.5) - 0.22 * pores, 0, 1)
              col = mix((46, 24, 12), (146, 88, 46), t)
              col *= (0.90 + 0.20 * fbm(U, V, 10, 10, 3, 19))[..., None]
              col = mix(col, (32, 16, 8), pores * 0.55)
              save_png(out("wood_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              del col
              hm = 0.48 * rings + 0.18 * cathedral + 0.34 * fibre - 0.32 * pores
              save_png(out("wood_normal.png"), normal_map(hm, 12.0))
              save_png(out("wood_rough.png"), u8(0.24 + 0.22 * rings + 0.12 * fibre + 0.26 * pores))
              gc.collect()

          def make_marble():
              w = h = 4096
              U, V = grid(w, h)
              turb = fbm(U, V, 3, 3, 7, 21, 0.62)
              turb2 = fbm(U, V, 4, 4, 7, 25, 0.60)
              t1 = np.abs(np.sin(2 * np.pi * (U * 1.0 + V * 2.0 + turb * 3.4)))
              t2 = np.abs(np.sin(2 * np.pi * (U * 2.0 - V * 1.0 + turb2 * 3.8)))
              t3 = np.abs(np.sin(2 * np.pi * (U * 3.0 + V * 1.0 + turb * 4.5)))
              v1 = (1 - t1) ** 5.0
              v2 = (1 - t2) ** 7.5 * 0.65
              gold_v = (1 - t3) ** 10.0 * 0.85
              cloud = fbm(U, V, 4, 4, 6, 31)
              mott = fbm(U, V, 16, 16, 4, 37)
              base = 0.88 + 0.10 * (cloud - 0.5) + 0.06 * (mott - 0.5)
              vein = np.clip(0.75 * v1 + v2, 0, 1) * (0.5 + 0.8 * mott)
              r = base * 238 - vein * 82 + gold_v * 35
              g = base * 233 - vein * 80 - gold_v * 5
              b = base * 224 - vein * 66 + 6 * cloud - gold_v * 55
              col = np.stack([r, g, b], axis=-1)
              noise = (hash2(np.arange(w, dtype=np.uint32)[None, :], np.arange(h, dtype=np.uint32)[:, None], 9) - 0.5) * 3.5
              col += noise[..., None]
              save_png(out("marble_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              del col
              save_png(out("marble_normal.png"), normal_map(0.45 * vein + 0.35 * gold_v + 0.2 * cloud, 4.5))
              save_png(out("marble_rough.png"), u8(0.09 + 0.16 * cloud + 0.12 * vein))
              gc.collect()

          def make_piece_textures():
              w, h = 4096, 4096
              U, V = grid(w, h)
              wv = fbm(U, V, 4, 4, 6, 61)
              t = np.abs(np.sin(2 * np.pi * (U * 3 + V * 2 + wv * 2.8)))
              vein = (1 - t) ** 5.5 * (0.4 + 0.6 * fbm(U, V, 10, 10, 4, 65))
              cloud = fbm(U, V, 5, 5, 5, 63)
              base = 0.90 + 0.07 * (cloud - 0.5)
              col = np.stack([base * 236 - vein * 68, base * 226 - vein * 72, base * 204 - vein * 68], axis=-1)
              save_png(out("piece_white.png"), np.clip(col, 0, 255).astype(np.uint8))
              del col

              wv2 = fbm(U, V, 4, 4, 6, 71)
              t2 = np.abs(np.sin(2 * np.pi * (U * 2 + V * 3 + wv2 * 3.0)))
              vein2 = (1 - t2) ** 7.0 * (0.35 + 0.65 * fbm(U, V, 10, 10, 4, 75))
              gold2 = (1 - np.abs(np.sin(2 * np.pi * (U * 4 - V * 2 + wv2 * 3.5)))) ** 11.0
              cloud2 = fbm(U, V, 6, 6, 5, 73)
              b2 = 12 + 14 * cloud2
              col2 = np.stack([
                  b2 + vein2 * 105 + gold2 * 185,
                  b2 + vein2 * 95 + gold2 * 145,
                  b2 + vein2 * 70 + gold2 * 55
              ], axis=-1)
              save_png(out("piece_black.png"), np.clip(col2, 0, 255).astype(np.uint8))
              del col2, U, V, wv, wv2

              w2, h2 = 2048, 2048
              U2, V2 = grid(w2, h2)
              pm = fbm(U2, V2, 12, 12, 5, 83)
              pv = (1 - np.abs(np.sin(2 * np.pi * (U2 * 3 + V2 * 2 + pm * 2.5)))) ** 6
              save_png(out("piece_normal.png"), normal_map(0.55 * pv + 0.45 * pm, 3.8))
              save_png(out("piece_rough.png"), u8(0.11 + 0.14 * pm + 0.08 * pv))
              gc.collect()

          def add_craters(hm, count, seed, rmin, rmax, depth):
              H, W = hm.shape
              r = np.random.default_rng(seed)
              for _ in range(count):
                  cx = int(r.integers(0, W)); cy = int(r.integers(0, H))
                  R = int(rmin + (rmax - rmin) * float(r.random()) ** 3)
                  ys = np.arange(cy - 2 * R, cy + 2 * R)
                  xs = np.arange(cx - 2 * R, cx + 2 * R)
                  dx = (xs[None, :] - cx).astype(np.float32)
                  dy = (ys[:, None] - cy).astype(np.float32)
                  d = np.sqrt(dx * dx + dy * dy) / R
                  bowl = -(1 - np.minimum(d, 1) ** 2) * depth * (d < 1)
                  rim = np.exp(-((d - 1.05) / 0.2) ** 2) * depth * 0.35
                  hm[np.ix_(ys % H, xs % W)] += bowl + rim
              return hm

          def make_earth():
              w, h = 4096, 2048
              U, V = grid(w, h)
              lat = np.abs(V - 0.5) * 2
              e = 0.75 * fbm(U, V, 4, 2, 7, 41) + 0.25 * fbm(U, V, 20, 10, 4, 43)
              e = e - 0.10 * lat ** 2
              sea = 0.455
              depth = np.clip((sea - e) / sea, 0, 1)
              ocean = mix((30, 120, 160), (4, 22, 70), depth ** 0.55)
              ht = np.clip((e - sea) / (1 - sea), 0, 1)
              moist = fbm(U, V, 5, 3, 5, 47)
              desert = smooth(0.52, 0.68, moist) * (1 - smooth(0.25, 0.55, lat))
              forest = mix((38, 98, 44), (86, 128, 58), np.clip(moist * 1.3, 0, 1))
              land = mix(forest, np.array([176, 148, 92], dtype=np.float32) + 0 * forest, desert)
              land = mix(land, (112, 98, 86), smooth(0.28, 0.5, ht))
              land = mix(land, (240, 244, 250), np.maximum(smooth(0.55, 0.75, ht), smooth(0.84, 0.93, lat)))
              coast = smooth(sea, sea + 0.012, e) * (1 - smooth(sea + 0.012, sea + 0.03, e))
              land = mix(land, (200, 184, 130), coast * 0.8)
              mask = smooth(sea - 0.003, sea + 0.003, e)
              col = ocean * (1 - mask[..., None]) + land * mask[..., None]
              col *= (0.92 + 0.16 * fbm(U, V, 32, 16, 3, 51))[..., None]
              polar = smooth(0.93, 0.995, lat) * 0.85
              col = col * (1 - polar[..., None]) + np.array([245, 248, 252], dtype=np.float32) * polar[..., None]
              save_png(out("earth_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              del col
              c = fbm(U, V, 6, 3, 6, 77) * 0.7 + fbm(U, V, 16, 8, 4, 79) * 0.3
              a = np.clip((c - 0.50) * 3.2, 0, 1) * 0.92
              rgba = np.zeros((h, w, 4), dtype=np.uint8)
              rgba[..., :3] = 255
              rgba[..., 3] = u8(a)
              save_png(out("earth_clouds.png"), rgba)
              gc.collect()

          def make_rock(name, base0, base1, craters, seed, w=2048, h=1024):
              U, V = grid(w, h)
              hm = 0.6 * fbm(U, V, 6, 3, 6, seed) + 0.4 * fbm(U, V, 24, 12, 4, seed + 3)
              hm = add_craters(hm.astype(np.float32), craters, seed, max(4, w // 180), max(16, w // 32), 0.18)
              n = fbm(U, V, 5, 3, 5, seed + 9)
              t = np.clip(0.25 + 0.6 * n + 0.8 * (hm - hm.mean()), 0, 1)
              col = mix(base0, base1, t)
              lat = np.abs(V - 0.5) * 2
              if name == "mars":
                  cap = smooth(0.92, 0.97, lat)
                  col = col * (1 - cap[..., None]) + np.array([240, 236, 236], dtype=np.float32) * cap[..., None]
              save_png(out(name + "_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              save_png(out(name + "_normal.png"), normal_map(hm, 9.5))
              gc.collect()

          def make_venus():
              w, h = 2048, 1024
              U, V = grid(w, h)
              turb = fbm(U, V, 4, 3, 5, 111)
              chev = 0.5 + 0.5 * np.sin(V * 28 + 3.8 * turb + 1.8 * np.cos(U * 2 * np.pi))
              swirl = fbm(U, V, 8, 4, 4, 113)
              t = np.clip(0.20 + 0.50 * chev + 0.30 * swirl, 0, 1)
              col = mix((168, 118, 62), (246, 224, 168), t)
              save_png(out("venus_texture.png"), np.clip(col, 0, 255).astype(np.uint8))

          def make_jupiter():
              w, h = 2048, 1024
              U, V = grid(w, h)
              turb = fbm(U, V, 8, 4, 6, 121)
              turb2 = fbm(U, V, 20, 10, 4, 123)
              vw = V + 0.028 * (turb - 0.5) + 0.014 * (turb2 - 0.5)
              b1 = 0.5 + 0.5 * np.sin(vw * 62)
              b2 = 0.5 + 0.5 * np.sin(vw * 24 + 1.1)
              eq = np.exp(-((vw - 0.50) / 0.08) ** 2)
              col = mix((148, 98, 62), (238, 220, 190), np.clip(0.55 * b1 + 0.35 * b2 + 0.25 * eq, 0, 1))
              dark_belt = np.exp(-((vw - 0.38) / 0.04) ** 2) + np.exp(-((vw - 0.62) / 0.045) ** 2)
              col = mix(col, (124, 66, 40), np.clip(dark_belt * 0.72, 0, 1))
              du = ((U - 0.50 + 0.5) % 1.0) - 0.5
              dv = V - 0.63
              grs = np.exp(-((du / 0.055) ** 2 + (dv / 0.042) ** 2))
              col = mix(col, (204, 78, 42), np.clip(grs * 0.90, 0, 1))
              save_png(out("jupiter_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              gc.collect()

          def make_saturn():
              w, h = 2048, 1024
              U, V = grid(w, h)
              turb = fbm(U, V, 6, 3, 5, 81)
              band = 0.5 + 0.5 * np.sin(V * 95 + turb * 4.5)
              band2 = 0.5 + 0.5 * np.sin(V * 31 + 1.7)
              n = fbm(U, V, 12, 6, 3, 91)
              t = np.clip(0.22 + 0.42 * band + 0.18 * band2 + 0.18 * n, 0, 1)
              col = mix((138, 108, 70), (240, 214, 160), t)
              save_png(out("saturn_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              s = 2048
              U, V = grid(s, s)
              r = np.sqrt((U - 0.5) ** 2 + (V - 0.5) ** 2) / 0.5
              inner, outer = 0.50, 1.0
              prof = smooth(inner, inner + 0.02, r) * (1 - smooth(outer - 0.03, outer, r))
              bands = 0.55 + 0.45 * np.sin(r * 130) * np.sin(r * 49 + 1.3)
              gap = 1 - 0.9 * np.exp(-((r - 0.80) / 0.018) ** 2)
              fine = 0.8 + 0.2 * fbm(r, r * 0, 256, 1, 2, 95)
              alpha = np.clip(prof * bands * gap * fine * 0.95, 0, 1)
              c = mix((170, 150, 118), (236, 218, 180), np.clip(bands, 0, 1))
              rgba = np.zeros((s, s, 4), dtype=np.uint8)
              rgba[..., :3] = np.clip(c, 0, 255).astype(np.uint8)
              rgba[..., 3] = u8(alpha)
              save_png(out("saturn_ring.png"), rgba)
              gc.collect()

          def make_uranus():
              w, h = 2048, 1024
              U, V = grid(w, h)
              band = 0.5 + 0.5 * np.sin(V * 24)
              n = fbm(U, V, 6, 3, 4, 141)
              t = np.clip(0.35 + 0.35 * band + 0.30 * n, 0, 1)
              col = mix((102, 198, 214), (186, 240, 246), t)
              save_png(out("uranus_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              s = 1024
              U, V = grid(s, s)
              r = np.sqrt((U - 0.5) ** 2 + (V - 0.5) ** 2) / 0.5
              prof = smooth(0.56, 0.59, r) * (1 - smooth(0.92, 0.96, r))
              rings = (0.35 + 0.65 * (np.sin(r * 130) ** 2)) * prof * 0.45
              c = mix((135, 190, 210), (210, 240, 250), np.clip(rings * 2, 0, 1))
              rgba = np.zeros((s, s, 4), dtype=np.uint8)
              rgba[..., :3] = np.clip(c, 0, 255).astype(np.uint8)
              rgba[..., 3] = u8(rings)
              save_png(out("uranus_ring.png"), rgba)

          def make_neptune():
              w, h = 2048, 1024
              U, V = grid(w, h)
              turb = fbm(U, V, 8, 4, 5, 151)
              band = 0.5 + 0.5 * np.sin(V * 36 + turb * 3.0)
              cirrus = np.clip((fbm(U, V, 12, 6, 3, 155) - 0.66) * 5.0, 0, 1)
              col = mix((26, 58, 168), (68, 132, 236), band)
              col = mix(col, (195, 228, 255), cirrus * 0.75)
              du = ((U - 0.45 + 0.5) % 1.0) - 0.5
              dv = V - 0.58
              gds = np.exp(-((du / 0.06) ** 2 + (dv / 0.045) ** 2))
              col = mix(col, (16, 30, 102), gds * 0.85)
              save_png(out("neptune_texture.png"), np.clip(col, 0, 255).astype(np.uint8))

          def make_pluto():
              w, h = 2048, 1024
              U, V = grid(w, h)
              n = fbm(U, V, 6, 3, 5, 161)
              col = mix((116, 78, 58), (206, 174, 146), n)
              du = ((U - 0.48 + 0.5) % 1.0) - 0.5
              dv = V - 0.52
              l1 = np.exp(-(((du + 0.045) / 0.055) ** 2 + ((dv - 0.015) / 0.070) ** 2))
              l2 = np.exp(-(((du - 0.045) / 0.055) ** 2 + ((dv + 0.010) / 0.065) ** 2))
              heart = np.clip(np.maximum(l1, l2) * 1.15, 0, 1)
              col = mix(col, (238, 228, 212), heart * 0.85)
              save_png(out("pluto_texture.png"), np.clip(col, 0, 255).astype(np.uint8))

          def make_asteroid():
              make_rock("asteroid", (58, 54, 52), (138, 130, 122), 70, 171, w=512, h=512)

          def make_sun():
              w, h = 2048, 1024
              U, V = grid(w, h)
              t = fbm(U, V, 8, 4, 6, 101)
              t2 = fbm(U, V, 28, 14, 4, 103)
              s = np.clip(0.35 + 0.7 * (t - 0.5) + 0.35 * (t2 - 0.5), 0, 1)
              col = mix((220, 70, 8), (255, 240, 160), s ** 0.8)
              save_png(out("sun_texture.png"), np.clip(col, 0, 255).astype(np.uint8))

          def make_sky():
              w, h = 4096, 2048
              U, V = grid(w, h)
              n1 = fbm(U, V, 3, 2, 6, 201)
              n2 = fbm(U, V, 5, 3, 6, 211)
              n3 = fbm(U, V, 4, 2, 5, 221)
              n4 = fbm(U, V, 7, 4, 5, 241)
              neb1 = np.clip((n1 - 0.36) * 2.5, 0, 1) ** 1.45
              neb2 = np.clip((n2 - 0.42) * 2.6, 0, 1) ** 1.55
              neb3 = np.clip((n3 - 0.44) * 2.8, 0, 1) ** 1.65
              neb4 = np.clip((n4 - 0.46) * 2.6, 0, 1) ** 1.55
              band_c = 0.5 + 0.14 * np.sin(2 * np.pi * U * 1.0)
              band = np.exp(-((V - band_c) / 0.13) ** 2)
              dust = fbm(U, V, 12, 6, 5, 231)
              col = np.zeros((h, w, 3), dtype=np.float32)
              col += neb1[..., None] * np.array([0.07, 0.28, 0.52], dtype=np.float32)
              col += neb2[..., None] * np.array([0.48, 0.11, 0.38], dtype=np.float32)
              col += neb3[..., None] * np.array([0.40, 0.20, 0.07], dtype=np.float32)
              col += neb4[..., None] * np.array([0.14, 0.38, 0.40], dtype=np.float32)
              col += (band * (0.42 + 0.65 * dust))[..., None] * np.array([0.26, 0.22, 0.24], dtype=np.float32)
              col *= (1 - 0.68 * (band * np.clip((dust - 0.55) * 3, 0, 1)))[..., None]
              col += 0.005
              r = np.random.default_rng(5)
              count = 32000
              sx = r.integers(0, w, count); sy = r.integers(0, h, count)
              br = r.random(count) ** 3.8
              tint = r.random(count)
              for dx in (-1, 0, 1):
                  for dy in (-1, 0, 1):
                      fall = 1.0 if dx == 0 and dy == 0 else 0.28
                      yy = np.clip(sy + dy, 0, h - 1); xx = (sx + dx) % w
                      for ch, mult in enumerate((1.0 - 0.3 * tint, 1.0 - 0.1 * tint, 0.7 + 0.3 * tint)):
                          np.add.at(col[..., ch], (yy, xx), br * fall * mult * (0.28 + 1.0 * band[yy, xx]))
              save_png(out("sky_nebula.png"), u8(np.clip(col, 0, 1) ** 0.85))
              del col
              gc.collect()

          def make_env():
              w, h = 2048, 1024
              U, V = grid(w, h)
              top = np.array([0.08, 0.14, 0.28], dtype=np.float32)
              hor = np.array([0.38, 0.32, 0.34], dtype=np.float32)
              bot = np.array([0.04, 0.05, 0.10], dtype=np.float32)
              t = V[..., None]
              col = np.where(t < 0.5, top + (hor - top) * (t / 0.5), hor + (bot - hor) * ((t - 0.5) / 0.5))
              neb = fbm(U, V, 5, 3, 4, 291)
              col += np.clip((neb - 0.45) * 2.5, 0, 1)[..., None] * np.array([0.16, 0.32, 0.55], dtype=np.float32)
              def box(u0, u1, v0, v1, color, soft=0.02):
                  m = smooth(u0 - soft, u0 + soft, U) * (1 - smooth(u1 - soft, u1 + soft, U))
                  m *= smooth(v0 - soft, v0 + soft, V) * (1 - smooth(v1 - soft, v1 + soft, V))
                  return m[..., None] * np.array(color, dtype=np.float32)
              def spot(uc, vc, ru, rv, color):
                  d = ((U - uc) / ru) ** 2 + ((V - vc) / rv) ** 2
                  return np.exp(-d)[..., None] * np.array(color, dtype=np.float32)
              col = col + spot(0.50, 0.30, 0.09, 0.12, (2.2, 1.85, 1.35))
              col = col + box(0.10, 0.24, 0.12, 0.38, (1.1, 1.15, 1.25))
              col = col + box(0.66, 0.80, 0.10, 0.34, (1.35, 1.0, 0.72))
              col = col + box(0.36, 0.41, 0.08, 0.55, (0.65, 0.92, 1.3))
              col = col + box(0.86, 0.94, 0.16, 0.44, (0.85, 0.65, 1.25))
              save_png(out("env_studio.png"), u8(np.clip(col, 0, 1)))

          def rgba_additive(rgb, alpha):
              a = np.clip(alpha, 0, 1)
              out_a = np.zeros(alpha.shape + (4,), dtype=np.uint8)
              for i in range(3):
                  out_a[..., i] = u8(rgb[i] / 255.0 * a)
              out_a[..., 3] = u8(a)
              return out_a

          def rgba_map(rgb, alpha):
              a = np.clip(alpha, 0, 1)
              out_a = np.zeros(alpha.shape + (4,), dtype=np.uint8)
              out_a[..., :3] = u8((np.clip(rgb, 0, 255) / 255.0) * a[..., None])
              out_a[..., 3] = u8(a)
              return out_a

          def make_fx():
              s = 512
              U, V = grid(s, s)
              X = (U - 0.5) * 2; Y = (V - 0.5) * 2
              R = np.sqrt(X * X + Y * Y)
              save_png(out("fx_glow.png"), rgba_additive((255, 244, 225), np.exp(-R * R * 4.5) * (R < 1)))
              save_png(out("fx_glow_warm.png"), rgba_additive((255, 170, 90), np.exp(-R * R * 3.6) * (R < 1)))
              save_png(out("fx_dust.png"), rgba_additive((255, 235, 200), np.exp(-R * R * 9) * (R < 1)))
              save_png(out("fx_spark.png"), rgba_additive((255, 220, 140), np.exp(-R * R * 16) * (R < 1)))
              w2, h2 = 1024, 128
              U2, V2 = grid(w2, h2)
              X2 = (U2 - 0.5) * 2; Y2 = (V2 - 0.5) * 2
              streak = np.exp(-(X2 / 0.55) ** 2) * np.exp(-(Y2 / 0.07) ** 2)
              save_png(out("fx_streak.png"), rgba_additive((255, 215, 170), streak))
              s2 = 512
              U3, V3 = grid(s2, s2)
              X3 = (U3 - 0.5) * 2; Y3 = (V3 - 0.5) * 2
              R3 = np.sqrt(X3 * X3 + Y3 * Y3)
              star = np.zeros_like(R3)
              for k in range(3):
                  ang = k * math.pi / 3 + 0.2
                  perp = np.abs(-np.sin(ang) * X3 + np.cos(ang) * Y3)
                  star += np.exp(-(perp / 0.012) ** 2) * np.exp(-R3 * 2.2)
              star += np.exp(-R3 * R3 * 30)
              save_png(out("fx_burst.png"), rgba_additive((255, 236, 200), star * (R3 < 1)))
              bw, bh = 256, 1024
              U4, V4 = grid(bw, bh)
              prof = np.exp(-((U4 - 0.5) / 0.20) ** 2) * (1 - V4) ** 1.4 * smooth(0.0, 0.03, 1 - V4)
              save_png(out("fx_beam.png"), rgba_additive((255, 226, 178), prof))
              s3 = 512
              U5, V5 = grid(s3, s3)
              R5 = np.sqrt((U5 - 0.5) ** 2 + (V5 - 0.5) ** 2) / 0.5
              halo = np.exp(-((R5 - 0.80) / 0.075) ** 2) * (R5 < 1)
              save_png(out("fx_halo.png"), rgba_additive((120, 180, 255), halo))
              save_png(out("fx_halo_warm.png"), rgba_additive((255, 190, 120), halo))
              def sq_dist(Xa, Ya):
                  return (np.abs(Xa) ** 5 + np.abs(Ya) ** 5) ** 0.2
              D = sq_dist(X, Y)
              def tile(color, fill, edge):
                  a = (fill + edge * np.exp(-((D - 0.90) / 0.07) ** 2)) * (1 - smooth(0.96, 1.0, D))
                  rgba = np.zeros((s, s, 4), dtype=np.uint8)
                  rgba[..., 0] = color[0]; rgba[..., 1] = color[1]; rgba[..., 2] = color[2]
                  rgba[..., 3] = u8(np.clip(a, 0, 1))
                  return rgba
              save_png(out("hl_tile_cyan.png"), tile((60, 215, 255), 0.35, 0.55))
              save_png(out("hl_tile_yellow.png"), tile((255, 215, 80), 0.28, 0.35))
              save_png(out("hl_tile_red.png"), tile((255, 40, 40), 0.50, 0.50))
              save_png(out("hl_tile_hint.png"), tile((175, 110, 255), 0.45, 0.55))
              dot = np.clip((0.30 - R) / 0.06, 0, 1) * 0.95 + 0.35 * np.exp(-R * R * 5)
              rd = np.zeros((s, s, 4), dtype=np.uint8)
              rd[..., 0] = 70; rd[..., 1] = 235; rd[..., 2] = 130
              rd[..., 3] = u8(np.clip(dot, 0, 1) * (R < 1))
              save_png(out("hl_dot_green.png"), rd)
              ring = np.exp(-((R - 0.72) / 0.09) ** 2) * 0.95 + 0.25 * np.exp(-R * R * 3)
              rr = np.zeros((s, s, 4), dtype=np.uint8)
              rr[..., 0] = 255; rr[..., 1] = 70; rr[..., 2] = 60
              rr[..., 3] = u8(np.clip(ring, 0, 1) * (R < 1))
              save_png(out("hl_ring_red.png"), rr)

          def make_blackhole_fx():
              s = 1024
              U, V = grid(s, s)
              X = (U - 0.5) * 2
              Y = (V - 0.5) * 2
              R = np.sqrt(X * X + Y * Y)
              A = np.arctan2(Y, X)
              turb = fbm(U, V, 6, 6, 5, 307)
              spiral1 = 0.5 + 0.5 * np.sin(3 * A + 16.0 * np.log(np.maximum(R, 0.12)) + 3.2 * turb)
              spiral2 = 0.5 + 0.5 * np.sin(7 * A + 26.0 * np.log(np.maximum(R, 0.12)) - 2.2 * turb)
              spiral3 = 0.5 + 0.5 * np.sin(11 * A + 34.0 * np.log(np.maximum(R, 0.12)) + 1.5 * turb)
              swirl = 0.45 * spiral1 + 0.35 * spiral2 + 0.20 * spiral3
              inner_cut = smooth(0.32, 0.36, R)
              outer_fade = (1 - smooth(0.52, 0.98, R)) ** 1.25
              isco_hot = np.exp(-((R - 0.38) / 0.038) ** 2)
              doppler = 0.85 + 0.28 * np.cos(A - 0.4)
              alpha = np.clip(((0.22 + 0.85 * swirl) * inner_cut * outer_fade + 0.90 * isco_hot * inner_cut) * doppler, 0, 1)
              t_col = np.clip((R - 0.35) / 0.54, 0, 1)
              col = mix((255, 248, 225), (255, 138, 35), smooth(0.0, 0.36, t_col))
              col = mix(col, (165, 45, 225), smooth(0.36, 0.85, t_col))
              col = mix(col, (65, 20, 140), smooth(0.80, 1.0, t_col))
              save_png(out("fx_blackhole_disk.png"), rgba_map(col, alpha))

              photon = np.exp(-((R - 0.365) / 0.020) ** 2) * 1.0
              arc_top = np.exp(-((R - 0.45) / 0.055) ** 2) * np.clip(0.5 + 0.5 * np.sin(A), 0, 1)
              lens = np.exp(-((R - 0.49) / 0.075) ** 2) * (0.28 + 0.25 * np.cos(2 * A + 0.5))
              doppler_r = 0.85 + 0.30 * np.cos(A - 0.3)
              ring_alpha = np.clip((photon + 0.7 * arc_top + lens) * smooth(0.33, 0.355, R) * (1 - smooth(0.84, 1.0, R)) * doppler_r, 0, 1)
              ring_col = mix((195, 115, 255), (255, 246, 215), np.clip(photon * 1.25, 0, 1))
              save_png(out("fx_blackhole_ring.png"), rgba_map(ring_col, ring_alpha))
              gc.collect()

          def make_nebulae():
              def make_neb(filename, c_in, c_out, seed):
                  s = 1024
                  U, V = grid(s, s)
                  X = (U - 0.5) * 2
                  Y = (V - 0.5) * 2
                  R = np.sqrt(X * X + Y * Y)
                  w1 = fbm(U, V, 3, 3, 5, seed)
                  w2 = fbm(U, V, 6, 6, 4, seed + 13)
                  wisp = np.clip((0.65 * w1 + 0.35 * w2 - 0.28) * 2.15, 0, 1) ** 1.3
                  fall = (1 - smooth(0.16, 0.98, R)) ** 1.45
                  alpha = np.clip(wisp * fall * 0.88, 0, 1)
                  col = mix(c_out, c_in, np.clip(wisp * fall * 1.38, 0, 1))
                  save_png(out(filename), rgba_map(col, alpha))
              make_neb("fx_nebula_cyan.png", (125, 235, 255), (20, 95, 210), 401)
              make_neb("fx_nebula_purple.png", (255, 140, 235), (110, 30, 195), 419)
              make_neb("fx_nebula_gold.png", (255, 215, 130), (195, 75, 40), 437)
