name: Build IPA & Release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Generate High-Res Textures, Audio & Icons
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset

          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024",
                "filename" : "icon_1024.png"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          python3 - << 'EOF'
          import wave, struct, math, random

          # Аудио-пак
          def create_wav(filename, duration, gen):
              rate = 44100
              with wave.open(filename, 'w') as w:
                  w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
                  frames = bytearray()
                  for i in range(int(rate * duration)):
                      t = float(i) / rate
                      l, r = gen(t, i)
                      frames.extend(struct.pack('<hh', max(-32767, min(32767, int(l * 32767))), max(-32767, min(32767, int(r * 32767)))))
                  w.writeframes(frames)

          print("Generating Sound Pack...")
          create_wav("Sources/ambient.wav", 120.0, lambda t, i: (math.sin(2*math.pi*55.0*t)*0.2, math.sin(2*math.pi*82.4*t)*0.18))
          create_wav("Sources/move.wav", 0.35, lambda t, i: (math.sin(2*math.pi*150.0*t)*math.exp(-t*30.0)*0.9, math.sin(2*math.pi*150.0*t)*math.exp(-t*30.0)*0.9))
          create_wav("Sources/capture.wav", 0.5, lambda t, i: ((math.sin(2*math.pi*85.0*t)+(random.random()*2-1)*0.35)*math.exp(-t*14.0), (math.sin(2*math.pi*85.0*t)+(random.random()*2-1)*0.35)*math.exp(-t*14.0)))
          create_wav("Sources/select.wav", 0.12, lambda t, i: (math.sin(2*math.pi*880.0*t)*math.exp(-t*50.0)*0.7, math.sin(2*math.pi*880.0*t)*math.exp(-t*50.0)*0.7))
          create_wav("Sources/click.wav", 0.08, lambda t, i: (math.sin(2*math.pi*950.0*t)*math.exp(-t*60.0)*0.8, math.sin(2*math.pi*950.0*t)*math.exp(-t*60.0)*0.8))

          # Текстуры дерева и мрамора
          w, h = 1024, 1024
          pixels_w = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  grain = math.sin(x * 0.03 + math.sin(y * 0.015) * 5.0) * 25.0
                  base = 45 + grain
                  pixels_w[idx] = max(0, min(255, int(base * 1.35)))
                  pixels_w[idx+1] = max(0, min(255, int(base * 0.88)))
                  pixels_w[idx+2] = max(0, min(255, int(base * 0.52)))
          with open('wood.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels_w)

          pixels_m = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  vein = abs(math.sin(x * 0.01 + y * 0.015 + math.sin(x * 0.02) * 3.5))
                  val = 215 + vein * 35
                  pixels_m[idx] = max(0, min(255, int(val)))
                  pixels_m[idx+1] = max(0, min(255, int(val * 0.98)))
                  pixels_m[idx+2] = max(0, min(255, int(val * 0.93)))
          with open('marble.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels_m)

          # Иконка
          pixels_i = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  nx, ny = (x - 512)/512.0, (y - 512)/512.0
                  dist = math.sqrt(nx*nx + ny*ny)
                  r = int(max(0, 15 - dist * 10))
                  g = int(max(0, 22 + (1.0 - dist) * 35))
                  b = int(max(0, 48 + (1.0 - dist) * 75))
                  dx = abs(x - 512)
                  if (760 <= y <= 820 and dx < 170) or (620 <= y < 760 and dx < 75) or (410 <= y < 620 and dx < 52) or ((x-512)**2 + (y-360)**2 < 70**2) or (220 <= y <= 310 and dx < 18) or (245 <= y <= 275 and dx < 50):
                      f = 1.0 - (y - 220)/600.0
                      r, g, b = 255, int(185 + f*60), int(45 + f*50)
                  pixels_i[idx] = max(0, min(255, r))
                  pixels_i[idx+1] = max(0, min(255, g))
                  pixels_i[idx+2] = max(0, min(255, b))
          with open('temp_icon.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels_i)
          EOF

          sips -s format png wood.ppm --out Sources/wood_texture.png
          sips -s format png marble.ppm --out Sources/marble_texture.png
          sips -s format png temp_icon.ppm --out Sources/Assets.xcassets/AppIcon.appiconset/icon_1024.png
          rm *.ppm

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          cat << 'EOF' > project.yml
          name: VibeChess
          options:
            bundleIdPrefix: com.vibe
          targets:
            VibeChess:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: "Камера необходима для режима дополненной реальности (AR)."
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' VibeChess.xcodeproj/project.pbxproj

      - name: Build App
        run: |
          xcodebuild -project VibeChess.xcodeproj -scheme VibeChess -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/VibeChess.app Payload/
          zip -r VibeChess.ipa Payload

      - name: Publish Public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.7.${{ github.run_number }}"
          gh release create "$VERSION" VibeChess.ipa \
            --title "VibeChess $VERSION (Cinematic Space & Smooth Physics)" \
            --notes "🪐 Ультимативный релиз VibeChess:
            - Устранены лаги и вылеты: фигуры больше не пересоздаются каждую секунду
            - Плавная физическая анимация перемещения фигур по дуге
            - Космос: Сатурн с кольцами и Черная Дыра с аккреционным диском прямо в кадре
            - Студийное трехточечное освещение и мягкие тени
            - Яркие, премиальные фигуры из полированной слоновой кости и темного эбена
            - Честные правила классических шахмат с часами"
