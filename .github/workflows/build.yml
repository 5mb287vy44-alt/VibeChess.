name: Build IPA & Release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | grep -vi candidate | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate textures, normal maps, effects and sounds
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset

          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024",
                "filename" : "icon_1024.png"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          python3 -m venv .venv
          ./.venv/bin/pip install --quiet numpy || ./.venv/bin/pip install --quiet numpy
          export PYTHONIOENCODING=utf-8
          cat << 'EOF' > gen_assets.py
          import numpy as np, zlib, struct, os, math, wave, random
          random.seed(11)

          OUT = os.environ.get("OUT_DIR", "Sources")
          ICON = os.environ.get("ICON_PATH", OUT + "/Assets.xcassets/AppIcon.appiconset/icon_1024.png")
          os.makedirs(OUT, exist_ok=True)
          os.makedirs(os.path.dirname(ICON), exist_ok=True)

          # ------------------------------------------------------------------ PNG
          def save_png(path, arr):
              arr = np.ascontiguousarray(arr)
              h, w = arr.shape[:2]
              c = 1 if arr.ndim == 2 else arr.shape[2]
              ctype = {1: 0, 3: 2, 4: 6}[c]
              raw = np.zeros((h, 1 + w * c), dtype=np.uint8)
              raw[:, 1:] = arr.reshape(h, w * c)
              def chunk(t, d):
                  cc = struct.pack('>I', len(d)) + t + d
                  return cc + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, ctype, 0, 0, 0))
              data += chunk(b'IDAT', zlib.compress(raw.tobytes(), 6))
              data += chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(data)

          def out(name):
              return OUT + "/" + name

          def u8(a):
              return np.clip(a * 255.0, 0, 255).astype(np.uint8)

          # ------------------------------------------------------------------ noise
          def hash2(ix, iy, seed):
              n = ix.astype(np.uint32) * np.uint32(374761393)
              n = n + iy.astype(np.uint32) * np.uint32(668265263)
              n = n + np.uint32((seed * 144665) & 0xffffffff)
              n = (n ^ (n >> np.uint32(13))) * np.uint32(1274126177)
              n = n ^ (n >> np.uint32(16))
              return (n & np.uint32(0xffff)).astype(np.float32) / 65535.0

          def vnoise(x, y, px, py, seed):
              xi = np.floor(x).astype(np.int64)
              yi = np.floor(y).astype(np.int64)
              xf = (x - xi).astype(np.float32)
              yf = (y - yi).astype(np.float32)
              x0 = xi % px; x1 = (x0 + 1) % px
              y0 = yi % py; y1 = (y0 + 1) % py
              u = xf * xf * (3 - 2 * xf)
              v = yf * yf * (3 - 2 * yf)
              a = hash2(x0, y0, seed); b = hash2(x1, y0, seed)
              c = hash2(x0, y1, seed); d = hash2(x1, y1, seed)
              return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v

          def fbm(U, V, bx, by, octaves, seed, gain=0.5):
              s = np.zeros_like(U, dtype=np.float32)
              amp = 1.0; tot = 0.0
              px, py = bx, by
              for o in range(octaves):
                  s += amp * vnoise(U * px, V * py, px, py, seed + o * 7)
                  tot += amp
                  px *= 2; py *= 2; amp *= gain
              return s / tot

          def grid(w, h):
              u = (np.arange(w, dtype=np.float32) + 0.5) / w
              v = (np.arange(h, dtype=np.float32) + 0.5) / h
              return np.meshgrid(u, v)

          def smooth(a, b, x):
              t = np.clip((x - a) / (b - a), 0, 1)
              return t * t * (3 - 2 * t)

          def mix(c0, c1, t):
              c0 = np.array(c0, dtype=np.float32); c1 = np.array(c1, dtype=np.float32)
              return c0 + (c1 - c0) * t[..., None]

          def normal_map(hm, strength):
              dx = (np.roll(hm, -1, 1) - np.roll(hm, 1, 1)) * strength
              dy = (np.roll(hm, -1, 0) - np.roll(hm, 1, 0)) * strength
              n = np.stack([-dx, dy, np.ones_like(hm)], axis=-1)
              n /= np.linalg.norm(n, axis=-1, keepdims=True)
              return u8(n * 0.5 + 0.5)

          # ------------------------------------------------------------------ доска
          def make_wood():
              w = h = 1024
              U, V = grid(w, h)
              warp = fbm(U, V, 3, 3, 4, 11)
              rings = 0.5 + 0.5 * np.sin(2 * np.pi * (V * 16 + warp * 5.5 + 0.6 * fbm(U, V, 2, 6, 3, 15)))
              fibre = fbm(U, V, 4, 128, 3, 5)
              pores = (fbm(U, V, 96, 12, 2, 9) > 0.66).astype(np.float32)
              t = np.clip(0.18 + 0.52 * rings + 0.30 * fibre - 0.18 * pores, 0, 1)
              col = mix((60, 34, 18), (158, 100, 56), t)
              col *= (0.94 + 0.12 * fbm(U, V, 8, 8, 2, 19))[..., None]
              save_png(out("wood_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              hm = 0.5 * rings + 0.35 * fibre - 0.25 * pores
              save_png(out("wood_normal.png"), normal_map(hm, 7.0))
              save_png(out("wood_rough.png"), u8(0.36 + 0.22 * rings + 0.15 * pores))

          def make_marble():
              w = h = 1024
              U, V = grid(w, h)
              turb = fbm(U, V, 3, 3, 7, 21, 0.62)
              turb2 = fbm(U, V, 4, 4, 7, 25, 0.60)
              t1 = np.abs(np.sin(2 * np.pi * (U * 1.0 + V * 2.0 + turb * 3.2)))
              t2 = np.abs(np.sin(2 * np.pi * (U * 2.0 - V * 1.0 + turb2 * 3.6)))
              v1 = (1 - t1) ** 4.5
              v2 = (1 - t2) ** 7 * 0.6
              cloud = fbm(U, V, 4, 4, 6, 31)
              mott = fbm(U, V, 12, 12, 4, 37)
              base = 0.90 + 0.10 * (cloud - 0.5) + 0.05 * (mott - 0.5)
              vein = np.clip(0.75 * v1 + v2, 0, 1) * (0.5 + 0.8 * mott)
              r = base * 247 - vein * 80
              g = base * 243 - vein * 78
              b = base * 234 - vein * 66 + 6 * cloud
              col = np.stack([r, g, b], axis=-1)
              col += (hash2(np.arange(w)[None, :].repeat(h, 0), np.arange(h)[:, None].repeat(w, 1), 9) - 0.5)[..., None] * 4
              save_png(out("marble_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              save_png(out("marble_normal.png"), normal_map(0.4 * vein + 0.2 * cloud, 2.5))
              save_png(out("marble_rough.png"), u8(0.12 + 0.18 * cloud + 0.1 * vein))

          def make_piece_textures():
              w, h = 512, 512
              U, V = grid(w, h)
              wv = fbm(U, V, 3, 3, 5, 61)
              t = np.abs(np.sin(2 * np.pi * (U * 3 + V * 2 + wv * 2.5)))
              vein = (1 - t) ** 5 * (0.4 + 0.6 * fbm(U, V, 8, 8, 3, 65))
              cloud = fbm(U, V, 4, 4, 4, 63)
              base = 0.92 + 0.06 * (cloud - 0.5)
              col = np.stack([base * 246 - vein * 70, base * 238 - vein * 74, base * 218 - vein * 70], axis=-1)
              save_png(out("piece_white.png"), np.clip(col, 0, 255).astype(np.uint8))
              wv2 = fbm(U, V, 3, 3, 5, 71)
              t2 = np.abs(np.sin(2 * np.pi * (U * 2 + V * 3 + wv2 * 2.8)))
              vein2 = (1 - t2) ** 6 * (0.3 + 0.7 * fbm(U, V, 8, 8, 3, 75))
              cloud2 = fbm(U, V, 5, 5, 4, 73)
              b2 = 14 + 14 * cloud2
              col2 = np.stack([b2 + vein2 * 120, b2 + vein2 * 105, b2 + vein2 * 70], axis=-1)
              save_png(out("piece_black.png"), np.clip(col2, 0, 255).astype(np.uint8))

          # ------------------------------------------------------------------ планеты
          def add_craters(hm, count, seed, rmin, rmax, depth):
              H, W = hm.shape
              r = np.random.default_rng(seed)
              for _ in range(count):
                  cx = int(r.integers(0, W)); cy = int(r.integers(0, H))
                  R = int(rmin + (rmax - rmin) * float(r.random()) ** 3)
                  ys = np.arange(cy - 2 * R, cy + 2 * R)
                  xs = np.arange(cx - 2 * R, cx + 2 * R)
                  dx = (xs[None, :] - cx).astype(np.float32)
                  dy = (ys[:, None] - cy).astype(np.float32)
                  d = np.sqrt(dx * dx + dy * dy) / R
                  bowl = -(1 - np.minimum(d, 1) ** 2) * depth * (d < 1)
                  rim = np.exp(-((d - 1.05) / 0.2) ** 2) * depth * 0.35
                  hm[np.ix_(ys % H, xs % W)] += bowl + rim
              return hm

          def make_earth():
              w, h = 2048, 1024
              U, V = grid(w, h)
              lat = np.abs(V - 0.5) * 2
              e = 0.75 * fbm(U, V, 4, 2, 6, 41) + 0.25 * fbm(U, V, 16, 8, 4, 43)
              e = e - 0.10 * lat ** 2
              sea = 0.455
              depth = np.clip((sea - e) / sea, 0, 1)
              ocean = mix((30, 120, 160), (4, 22, 70), depth ** 0.55)
              ht = np.clip((e - sea) / (1 - sea), 0, 1)
              moist = fbm(U, V, 5, 3, 5, 47)
              desert = smooth(0.52, 0.68, moist) * (1 - smooth(0.25, 0.55, lat))
              forest = mix((38, 98, 44), (86, 128, 58), np.clip(moist * 1.3, 0, 1))
              land = mix(forest, np.array([176, 148, 92], dtype=np.float32) + 0 * forest, desert)
              land = mix(land, (112, 98, 86), smooth(0.28, 0.5, ht))
              land = mix(land, (240, 244, 250), np.maximum(smooth(0.55, 0.75, ht), smooth(0.84, 0.93, lat)))
              coast = smooth(sea, sea + 0.012, e) * (1 - smooth(sea + 0.012, sea + 0.03, e))
              land = mix(land, (200, 184, 130), coast * 0.8)
              mask = smooth(sea - 0.003, sea + 0.003, e)
              col = ocean * (1 - mask[..., None]) + land * mask[..., None]
              col *= (0.92 + 0.16 * fbm(U, V, 32, 16, 3, 51))[..., None]
              polar = smooth(0.93, 0.995, lat) * 0.85
              col = col * (1 - polar[..., None]) + np.array([245, 248, 252], dtype=np.float32) * polar[..., None]
              save_png(out("earth_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              c = fbm(U, V, 6, 3, 6, 77) * 0.7 + fbm(U, V, 14, 7, 4, 79) * 0.3
              a = np.clip((c - 0.50) * 3.2, 0, 1) * 0.92
              rgba = np.zeros((h, w, 4), dtype=np.uint8)
              rgba[..., :3] = 255
              rgba[..., 3] = u8(a)
              save_png(out("earth_clouds.png"), rgba)

          def make_rock(name, base0, base1, craters, seed):
              w, h = 1024, 512
              U, V = grid(w, h)
              hm = 0.6 * fbm(U, V, 6, 3, 6, seed) + 0.4 * fbm(U, V, 24, 12, 4, seed + 3)
              hm = add_craters(hm.astype(np.float32), craters, seed, 6, 34, 0.18)
              n = fbm(U, V, 5, 3, 5, seed + 9)
              t = np.clip(0.25 + 0.6 * n + 0.8 * (hm - hm.mean()), 0, 1)
              col = mix(base0, base1, t)
              lat = np.abs(V - 0.5) * 2
              if name == "mars":
                  cap = smooth(0.92, 0.97, lat)
                  col = col * (1 - cap[..., None]) + np.array([240, 236, 236], dtype=np.float32) * cap[..., None]
              save_png(out(name + "_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              save_png(out(name + "_normal.png"), normal_map(hm, 9.0))

          def make_saturn():
              w, h = 1024, 512
              U, V = grid(w, h)
              turb = fbm(U, V, 6, 3, 4, 81)
              band = 0.5 + 0.5 * np.sin(V * 95 + turb * 4.5)
              band2 = 0.5 + 0.5 * np.sin(V * 31 + 1.7)
              n = fbm(U, V, 12, 6, 3, 91)
              t = np.clip(0.22 + 0.42 * band + 0.18 * band2 + 0.18 * n, 0, 1)
              col = mix((138, 108, 70), (240, 214, 160), t)
              save_png(out("saturn_texture.png"), np.clip(col, 0, 255).astype(np.uint8))
              s = 1024
              U, V = grid(s, s)
              r = np.sqrt((U - 0.5) ** 2 + (V - 0.5) ** 2) / 0.5
              inner, outer = 0.50, 1.0
              prof = smooth(inner, inner + 0.02, r) * (1 - smooth(outer - 0.03, outer, r))
              bands = 0.55 + 0.45 * np.sin(r * 120) * np.sin(r * 47 + 1.3)
              gap = 1 - 0.9 * np.exp(-((r - 0.80) / 0.018) ** 2)
              fine = 0.8 + 0.2 * fbm(r, r * 0, 256, 1, 2, 95)
              alpha = np.clip(prof * bands * gap * fine * 0.95, 0, 1)
              c = mix((170, 150, 118), (236, 218, 180), np.clip(bands, 0, 1))
              rgba = np.zeros((s, s, 4), dtype=np.uint8)
              rgba[..., :3] = np.clip(c, 0, 255).astype(np.uint8)
              rgba[..., 3] = u8(alpha)
              save_png(out("saturn_ring.png"), rgba)

          def make_sun():
              w, h = 1024, 512
              U, V = grid(w, h)
              t = fbm(U, V, 8, 4, 6, 101)
              t2 = fbm(U, V, 24, 12, 3, 103)
              s = np.clip(0.35 + 0.7 * (t - 0.5) + 0.3 * (t2 - 0.5), 0, 1)
              col = mix((220, 70, 8), (255, 236, 150), s ** 0.8)
              save_png(out("sun_texture.png"), np.clip(col, 0, 255).astype(np.uint8))

          # ------------------------------------------------------------------ небо
          def make_sky():
              w, h = 2048, 1024
              U, V = grid(w, h)
              n1 = fbm(U, V, 3, 2, 6, 201)
              n2 = fbm(U, V, 5, 3, 6, 211)
              n3 = fbm(U, V, 4, 2, 5, 221)
              neb1 = np.clip((n1 - 0.42) * 2.4, 0, 1) ** 1.6
              neb2 = np.clip((n2 - 0.48) * 2.6, 0, 1) ** 1.7
              neb3 = np.clip((n3 - 0.50) * 3.0, 0, 1) ** 1.8
              band_c = 0.5 + 0.12 * np.sin(2 * np.pi * U * 1.0)
              band = np.exp(-((V - band_c) / 0.10) ** 2)
              dust = fbm(U, V, 10, 5, 5, 231)
              col = np.zeros((h, w, 3), dtype=np.float32)
              col += neb1[..., None] * np.array([0.07, 0.22, 0.40], dtype=np.float32)
              col += neb2[..., None] * np.array([0.38, 0.09, 0.28], dtype=np.float32)
              col += neb3[..., None] * np.array([0.30, 0.16, 0.05], dtype=np.float32)
              col += (band * (0.35 + 0.65 * dust))[..., None] * np.array([0.20, 0.18, 0.17], dtype=np.float32)
              col *= (1 - 0.65 * (band * np.clip((dust - 0.55) * 3, 0, 1)))[..., None]
              col += 0.004
              r = np.random.default_rng(5)
              count = 14000
              sx = r.integers(0, w, count); sy = r.integers(0, h, count)
              br = r.random(count) ** 4.0
              tint = r.random(count)
              for dx in (-1, 0, 1):
                  for dy in (-1, 0, 1):
                      fall = 1.0 if dx == 0 and dy == 0 else 0.25
                      yy = np.clip(sy + dy, 0, h - 1); xx = (sx + dx) % w
                      for ch, mult in enumerate((1.0 - 0.3 * tint, 1.0 - 0.1 * tint, 0.7 + 0.3 * tint)):
                          np.add.at(col[..., ch], (yy, xx), br * fall * mult * (0.25 + 1.0 * band[yy, xx]))
              save_png(out("sky_nebula.png"), u8(np.clip(col, 0, 1) ** 0.85))

          def make_env():
              w, h = 1024, 512
              U, V = grid(w, h)
              top = np.array([0.20, 0.26, 0.40], dtype=np.float32)
              hor = np.array([0.62, 0.55, 0.46], dtype=np.float32)
              bot = np.array([0.05, 0.045, 0.05], dtype=np.float32)
              t = V[..., None]
              col = np.where(t < 0.5, top + (hor - top) * (t / 0.5), hor + (bot - hor) * ((t - 0.5) / 0.5))
              def box(u0, u1, v0, v1, color, soft=0.02):
                  m = smooth(u0 - soft, u0 + soft, U) * (1 - smooth(u1 - soft, u1 + soft, U))
                  m *= smooth(v0 - soft, v0 + soft, V) * (1 - smooth(v1 - soft, v1 + soft, V))
                  return m[..., None] * np.array(color, dtype=np.float32)
              col = col + box(0.10, 0.24, 0.12, 0.38, (1.2, 1.15, 1.05))
              col = col + box(0.60, 0.76, 0.08, 0.32, (1.3, 1.0, 0.7))
              col = col + box(0.42, 0.45, 0.10, 0.62, (0.8, 0.9, 1.2))
              col = col + box(0.86, 0.93, 0.18, 0.40, (0.7, 0.8, 1.1))
              save_png(out("env_studio.png"), u8(np.clip(col, 0, 1)))

          # ------------------------------------------------------------------ FX
          def rgba_additive(rgb, alpha):
              a = np.clip(alpha, 0, 1)
              out_a = np.zeros(alpha.shape + (4,), dtype=np.uint8)
              for i in range(3):
                  out_a[..., i] = u8(rgb[i] / 255.0 * a)
              out_a[..., 3] = u8(a)
              return out_a

          def make_fx():
              s = 256
              U, V = grid(s, s)
              X = (U - 0.5) * 2; Y = (V - 0.5) * 2
              R = np.sqrt(X * X + Y * Y)
              save_png(out("fx_glow.png"), rgba_additive((255, 244, 225), np.exp(-R * R * 4.5) * (R < 1)))
              save_png(out("fx_glow_warm.png"), rgba_additive((255, 170, 90), np.exp(-R * R * 3.6) * (R < 1)))
              save_png(out("fx_dust.png"), rgba_additive((255, 235, 200), np.exp(-R * R * 9) * (R < 1)))
              save_png(out("fx_spark.png"), rgba_additive((255, 220, 140), np.exp(-R * R * 16) * (R < 1)))
              # анаморфный блик
              w2, h2 = 512, 64
              U2, V2 = grid(w2, h2)
              X2 = (U2 - 0.5) * 2; Y2 = (V2 - 0.5) * 2
              streak = np.exp(-(X2 / 0.55) ** 2) * np.exp(-(Y2 / 0.07) ** 2)
              save_png(out("fx_streak.png"), rgba_additive((255, 215, 170), streak))
              # лучистая звезда
              s2 = 512
              U3, V3 = grid(s2, s2)
              X3 = (U3 - 0.5) * 2; Y3 = (V3 - 0.5) * 2
              R3 = np.sqrt(X3 * X3 + Y3 * Y3)
              A = np.arctan2(Y3, X3)
              star = np.zeros_like(R3)
              for k in range(3):
                  ang = k * math.pi / 3 + 0.2
                  perp = np.abs(-np.sin(ang) * X3 + np.cos(ang) * Y3)
                  star += np.exp(-(perp / 0.012) ** 2) * np.exp(-R3 * 2.2)
              star += np.exp(-R3 * R3 * 30)
              save_png(out("fx_burst.png"), rgba_additive((255, 236, 200), star * (R3 < 1)))
              # луч для объёмного света: ширина по u, яркость вдоль v
              bw, bh = 128, 512
              U4, V4 = grid(bw, bh)
              prof = np.exp(-((U4 - 0.5) / 0.20) ** 2) * (1 - V4) ** 1.4 * smooth(0.0, 0.03, 1 - V4)
              save_png(out("fx_beam.png"), rgba_additive((255, 226, 178), prof))
              # ореол атмосферы планет
              s3 = 512
              U5, V5 = grid(s3, s3)
              R5 = np.sqrt((U5 - 0.5) ** 2 + (V5 - 0.5) ** 2) / 0.5
              halo = np.exp(-((R5 - 0.80) / 0.075) ** 2) * (R5 < 1)
              save_png(out("fx_halo.png"), rgba_additive((120, 180, 255), halo))
              save_png(out("fx_halo_warm.png"), rgba_additive((255, 190, 120), halo))
              # подсветка клеток
              def sq_dist(Xa, Ya):
                  return (np.abs(Xa) ** 5 + np.abs(Ya) ** 5) ** 0.2
              D = sq_dist(X, Y)
              def tile(color, fill, edge):
                  a = (fill + edge * np.exp(-((D - 0.90) / 0.07) ** 2)) * (1 - smooth(0.96, 1.0, D))
                  rgba = np.zeros((s, s, 4), dtype=np.uint8)
                  rgba[..., 0] = color[0]; rgba[..., 1] = color[1]; rgba[..., 2] = color[2]
                  rgba[..., 3] = u8(np.clip(a, 0, 1))
                  return rgba
              save_png(out("hl_tile_cyan.png"), tile((60, 215, 255), 0.35, 0.55))
              save_png(out("hl_tile_yellow.png"), tile((255, 215, 80), 0.28, 0.35))
              save_png(out("hl_tile_red.png"), tile((255, 40, 40), 0.50, 0.50))
              save_png(out("hl_tile_hint.png"), tile((175, 110, 255), 0.45, 0.55))
              dot = np.clip((0.30 - R) / 0.06, 0, 1) * 0.95 + 0.35 * np.exp(-R * R * 5)
              rd = np.zeros((s, s, 4), dtype=np.uint8)
              rd[..., 0] = 70; rd[..., 1] = 235; rd[..., 2] = 130
              rd[..., 3] = u8(np.clip(dot, 0, 1) * (R < 1))
              save_png(out("hl_dot_green.png"), rd)
              ring = np.exp(-((R - 0.72) / 0.09) ** 2) * 0.95 + 0.25 * np.exp(-R * R * 3)
              rr = np.zeros((s, s, 4), dtype=np.uint8)
              rr[..., 0] = 255; rr[..., 1] = 70; rr[..., 2] = 60
              rr[..., 3] = u8(np.clip(ring, 0, 1) * (R < 1))
              save_png(out("hl_ring_red.png"), rr)

          # ------------------------------------------------------------------ иконка
          def make_icon():
              s = 1024
              U, V = grid(s, s)
              X = (U - 0.5) * 2; Y = (V - 0.5) * 2
              R = np.sqrt(X * X + Y * Y)
              col = np.zeros((s, s, 3), dtype=np.float32)
              col[..., 0] = 8 + (1 - R) * 22
              col[..., 1] = 12 + (1 - R) * 40
              col[..., 2] = 34 + (1 - R) * 92
              r = np.random.default_rng(3)
              for _ in range(260):
                  x = int(r.integers(0, s)); y = int(r.integers(0, s)); b = 120 + 130 * r.random()
                  col[max(0, y - 1):y + 2, max(0, x - 1):x + 2] += b
              px = (U * s); py = (V * s)
              pd = np.sqrt((px - 770) ** 2 + (py - 250) ** 2)
              k = np.clip(1 - pd / 130, 0, 1)
              planet = np.stack([235 * k + 60, 150 * k + 30, 70 * k + 10], axis=-1) * (pd < 130)[..., None]
              col = col * (pd >= 130)[..., None] + planet
              glow = np.exp(-(pd / 210) ** 2) * 60
              col[..., 0] += glow; col[..., 1] += glow * 0.55
              dx = np.abs(px - 512)
              king = (((px - 512) ** 2 + (py - 345) ** 2) < 60 ** 2)
              king |= (200 <= py) & (py <= 330) & (dx < 19)
              king |= (232 <= py) & (py <= 268) & (dx < 56)
              king |= (400 <= py) & (py < 440) & (dx < 108)
              king |= (440 <= py) & (py < 700) & (dx < 60 + (py - 440) * 0.26)
              king |= (700 <= py) & (py < 790) & (dx < 150)
              king |= (790 <= py) & (py <= 845) & (dx < 232)
              f = np.clip(1 - (py - 200) / 650, 0, 1)
              gold = np.stack([255 + 0 * f, 186 + 58 * f, 58 + 80 * f], axis=-1)
              gold *= (0.86 + 0.14 * np.clip(1 - np.abs(px - 470) / 260, 0, 1))[..., None]
              col = np.where(king[..., None], gold, col)
              save_png(ICON, np.clip(col, 0, 255).astype(np.uint8))


          import time
          t0 = time.time()
          for fn in (make_wood, make_marble, make_piece_textures, make_earth,
                     lambda: make_rock("mars", (95, 40, 24), (210, 118, 72), 90, 61),
                     lambda: make_rock("moon", (70, 70, 72), (200, 198, 192), 160, 131),
                     make_saturn, make_sun, make_sky, make_env, make_fx, make_icon):
              fn()
              print("visual ok", round(time.time() - t0, 1), "s")

          # ---------- звуки ----------
          def create_wav(filename, duration, gen, rate=44100):
              n = int(rate * duration)
              frames = bytearray()
              for i in range(n):
                  l, r = gen(i / rate)
                  l = max(-1.0, min(1.0, l)); r = max(-1.0, min(1.0, r))
                  frames += struct.pack('<hh', int(l * 32000), int(r * 32000))
              with wave.open(OUT + "/" + filename, 'w') as w:
                  w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
                  w.writeframes(bytes(frames))

          TAU = 2 * math.pi
          def noise(): return random.random() * 2 - 1

          def move_s(t):
              e = math.exp(-t * 30)
              s = (math.sin(TAU * 190 * t) * 0.55 + math.sin(TAU * 96 * t) * 0.5 + noise() * 0.25 * math.exp(-t * 110)) * e
              return s, s

          def capture_s(t):
              e = math.exp(-t * 13)
              s = (math.sin(TAU * 80 * t) * 0.6 + noise() * 0.4 * math.exp(-t * 35) + math.sin(TAU * 150 * t) * 0.3) * e
              return s, s

          def select_s(t):
              s = math.sin(TAU * 1200 * t) * math.exp(-t * 60) * 0.35
              return s, s

          def click_s(t):
              s = math.sin(TAU * 880 * t) * math.exp(-t * 75) * 0.35
              return s, s

          def check_s(t):
              f = 660 if t < 0.16 else 880
              tt = t if t < 0.16 else t - 0.16
              s = math.sin(TAU * f * tt) * math.exp(-tt * 9) * 0.45
              return s, s

          def win_s(t):
              notes = [523.25, 659.25, 783.99, 1046.5]
              k = min(3, int(t / 0.18))
              tt = t - k * 0.18
              s = (math.sin(TAU * notes[k] * tt) + 0.3 * math.sin(TAU * notes[k] * 2 * tt)) * math.exp(-tt * 3.2) * 0.35
              return s, s

          def ambient_s(t):
              lfo = 0.6 + 0.4 * math.sin(TAU * 0.1 * t)
              lfo2 = 0.5 + 0.5 * math.sin(TAU * 0.2 * t)
              a = math.sin(TAU * 55.0 * t) * 0.20
              b = math.sin(TAU * 82.5 * t) * 0.13 * lfo
              c = math.sin(TAU * 110.0 * t) * 0.07 * lfo2
              d = math.sin(TAU * 165.0 * t) * 0.04 * (1 - lfo2)
              return a + b + c, a + d + c * 0.8

          print("Sounds...")
          create_wav("move.wav", 0.2, move_s)
          create_wav("capture.wav", 0.4, capture_s)
          create_wav("select.wav", 0.08, select_s)
          create_wav("click.wav", 0.06, click_s)
          create_wav("check.wav", 0.6, check_s)
          create_wav("win.wav", 1.2, win_s)
          create_wav("ambient.wav", 30.0, ambient_s, rate=22050)
          print("Audio done")

          EOF
          ./.venv/bin/python gen_assets.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cat << 'EOF' > project.yml
          name: VibeChess
          options:
            bundleIdPrefix: com.vibe
          targets:
            VibeChess:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: "Камера необходима для режима AR."
                  DEBUG_INFORMATION_FORMAT: dwarf
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate

      - name: Build app (Release)
        run: |
          xcodebuild -project VibeChess.xcodeproj -scheme VibeChess -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/VibeChess.app Payload/
          zip -r VibeChess.ipa Payload

      - name: Publish Public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v4.0.${{ github.run_number }}"
          gh release create "$VERSION" VibeChess.ipa \
            --title "VibeChess $VERSION (photoreal graphics)" \
            --notes "Версия 4.0, графика:
            - Фотореалистичные материалы: нормали, шероховатость, мрамор и орех
            - Фигуры с золотой инкрустацией, конь с новым силуэтом
            - Объёмные лучи света, пыль в лучах, блики и свечение солнца
            - Планеты с облаками, атмосферой и кольцами Сатурна, туманность
            - Отражающий постамент, мягкие тени, SSAO, bloom, виньетка
            - Искры при взятии и салют при мате
            - Настройка качества графики"
