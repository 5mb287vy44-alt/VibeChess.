          def make_icon():
              s = 1024
              U, V = grid(s, s)
              X = (U - 0.5) * 2; Y = (V - 0.5) * 2
              R = np.sqrt(X * X + Y * Y)
              col = np.zeros((s, s, 3), dtype=np.float32)
              col[..., 0] = 8 + (1 - R) * 22
              col[..., 1] = 12 + (1 - R) * 40
              col[..., 2] = 34 + (1 - R) * 92
              r = np.random.default_rng(3)
              for _ in range(260):
                  x = int(r.integers(0, s)); y = int(r.integers(0, s)); b = 120 + 130 * r.random()
                  col[max(0, y - 1):y + 2, max(0, x - 1):x + 2] += b
              px = (U * s); py = (V * s)
              pd = np.sqrt((px - 770) ** 2 + (py - 250) ** 2)
              k = np.clip(1 - pd / 130, 0, 1)
              planet = np.stack([235 * k + 60, 150 * k + 30, 70 * k + 10], axis=-1) * (pd < 130)[..., None]
              col = col * (pd >= 130)[..., None] + planet
              glow = np.exp(-(pd / 210) ** 2) * 60
              col[..., 0] += glow; col[..., 1] += glow * 0.55
              dx = np.abs(px - 512)
              king = (((px - 512) ** 2 + (py - 345) ** 2) < 60 ** 2)
              king |= (200 <= py) & (py <= 330) & (dx < 19)
              king |= (232 <= py) & (py <= 268) & (dx < 56)
              king |= (400 <= py) & (py < 440) & (dx < 108)
              king |= (440 <= py) & (py < 700) & (dx < 60 + (py - 440) * 0.26)
              king |= (700 <= py) & (py < 790) & (dx < 150)
              king |= (790 <= py) & (py <= 845) & (dx < 232)
              f = np.clip(1 - (py - 200) / 650, 0, 1)
              gold = np.stack([255 + 0 * f, 186 + 58 * f, 58 + 80 * f], axis=-1)
              gold *= (0.86 + 0.14 * np.clip(1 - np.abs(px - 470) / 260, 0, 1))[..., None]
              col = np.where(king[..., None], gold, col)
              save_png(ICON, np.clip(col, 0, 255).astype(np.uint8))

          import time
          t0 = time.time()
          for fn in (make_wood, make_marble, make_piece_textures,
                     lambda: make_rock("mercury", (72, 68, 66), (168, 162, 154), 140, 31, 2048, 1024),
                     make_venus, make_earth,
                     lambda: make_rock("mars", (95, 40, 24), (210, 118, 72), 110, 61, 2048, 1024),
                     lambda: make_rock("moon", (70, 70, 72), (200, 198, 192), 180, 131, 2048, 1024),
                     make_jupiter, make_saturn, make_uranus, make_neptune, make_pluto, make_asteroid,
                     make_sun, make_sky, make_env, make_fx, make_blackhole_fx, make_nebulae, make_comet_fx, make_explosion_fx, make_icon):
              fn()
              print("visual ok", round(time.time() - t0, 1), "s")

          SR = 44100
          TAU = 2.0 * np.pi

          def save_wav(filename, L, R, rate=SR):
              peak = max(1e-6, float(np.max(np.abs(L))), float(np.max(np.abs(R))))
              if peak > 0.94:
                  scale = 0.94 / peak
                  L = L * scale
                  R = R * scale
              L = np.clip(L, -1.0, 1.0)
              R = np.clip(R, -1.0, 1.0)
              stereo = np.stack([L, R], axis=-1)
              pcm = (stereo * 32000.0).astype('<i2').tobytes()
              with wave.open(OUT + "/" + filename, 'w') as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  w.writeframes(pcm)

          def edge_fade(n, fade_in_s=0.003, fade_out_s=0.02):
              env = np.ones(n, dtype=np.float64)
              fi = min(n // 2, max(1, int(fade_in_s * SR)))
              fo = min(n // 2, max(1, int(fade_out_s * SR)))
              env[:fi] = np.sin(np.linspace(0, np.pi / 2, fi)) ** 2
              env[-fo:] = np.cos(np.linspace(0, np.pi / 2, fo)) ** 2
              return env

          def band_noise(n, f_low, f_high, seed):
              rng = np.random.default_rng(seed)
              x = rng.standard_normal(n)
              X = np.fft.rfft(x)
              freqs = np.fft.rfftfreq(n, 1.0 / SR)
              mask = np.ones_like(freqs)
              if f_low > 0:
                  mask *= np.clip((freqs - f_low * 0.5) / max(1.0, f_low * 0.5), 0.0, 1.0)
              if f_high < SR * 0.5:
                  mask *= 1.0 / (1.0 + (freqs / max(1.0, f_high)) ** 4)
              y = np.fft.irfft(X * mask, n=n)
              return y / max(1e-6, float(np.max(np.abs(y))))

          def make_move_sound():
              dur = 0.28
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              f_thud = 56.0 + 42.0 * np.exp(-t * 48.0)
              ph_thud = np.cumsum(f_thud) * (TAU / SR)
              thud = np.sin(ph_thud) * np.exp(-t * 26.0) * 0.55
              wood = (
                  np.sin(TAU * 138.0 * t) * 0.45 * np.exp(-t * 34.0)
                  + np.sin(TAU * 252.0 * t) * 0.30 * np.exp(-t * 46.0)
                  + np.sin(TAU * 415.0 * t) * 0.16 * np.exp(-t * 68.0)
              )
              tap = band_noise(n, 700, 2600, 101) * np.exp(-t * 190.0) * 0.42
              l = (thud + wood + tap) * edge_fade(n, 0.002, 0.03)
              r = (thud + wood * 0.96 + np.roll(tap, 6) * 0.9) * edge_fade(n, 0.002, 0.03)
              save_wav("move.wav", l, r)

          def make_select_sound():
              dur = 0.13
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              chime = (
                  np.sin(TAU * 659.25 * t) * 0.42 * np.exp(-t * 34.0)
                  + np.sin(TAU * 987.77 * t) * 0.32 * np.exp(-t * 40.0)
                  + np.sin(TAU * 1318.5 * t) * 0.18 * np.exp(-t * 48.0)
              )
              tick = band_noise(n, 900, 3200, 102) * np.exp(-t * 210.0) * 0.22
              sig = (chime + tick) * edge_fade(n, 0.003, 0.025) * 0.65
              save_wav("select.wav", sig, np.roll(sig, 4))

          def make_click_sound():
              dur = 0.10
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              body = (
                  np.sin(TAU * 320.0 * t) * 0.45 * np.exp(-t * 65.0)
                  + np.sin(TAU * 690.0 * t) * 0.30 * np.exp(-t * 95.0)
              )
              tap = band_noise(n, 800, 2800, 103) * np.exp(-t * 240.0) * 0.28
              sig = (body + tap) * edge_fade(n, 0.002, 0.02) * 0.6
              save_wav("click.wav", sig, sig)

          def make_capture_sound():
              dur = 0.70
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              f_hit = 46.0 + 135.0 * np.exp(-t * 26.0)
              ph_hit = np.cumsum(f_hit) * (TAU / SR)
              impact = np.sin(ph_hit) * np.exp(-t * 14.0) * 0.72
              crack = band_noise(n, 450, 3600, 104) * np.exp(-t * 65.0) * 0.55
              rift_env = smooth(0.03, 0.16, t) * np.exp(-np.maximum(0.0, t - 0.14) * 5.2)
              rift_l = band_noise(n, 110, 620, 105) * rift_env * 0.42
              rift_r = band_noise(n, 120, 650, 106) * rift_env * 0.42
              l = np.tanh((impact + crack + rift_l) * 1.15) * edge_fade(n, 0.002, 0.08)
              r = np.tanh((impact + np.roll(crack, 8) + rift_r) * 1.15) * edge_fade(n, 0.002, 0.08)
              save_wav("capture.wav", l, r)

          def make_blackhole_sound():
              dur = 0.95
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              env = smooth(0.02, 0.16, t) * (1.0 - smooth(0.55, 0.94, t))
              f_sub = 132.0 * np.exp(-t * 2.15) + 28.0
              ph_sub = np.cumsum(f_sub) * (TAU / SR)
              sub = np.sin(ph_sub) * 0.65 + np.sin(ph_sub * 1.99) * 0.25
              lfo_rate = 3.5 + 14.0 * (t / dur) ** 1.6
              ph_lfo = np.cumsum(lfo_rate) * (TAU / SR)
              swirl_l = 0.65 + 0.35 * np.sin(ph_lfo)
              swirl_r = 0.65 + 0.35 * np.cos(ph_lfo)
              wind_l = band_noise(n, 90, 950, 107) * swirl_l
              wind_r = band_noise(n, 95, 980, 108) * swirl_r
              gulp_t = np.maximum(0.0, t - 0.56)
              gulp = (t > 0.56) * np.sin(TAU * (92.0 - 45.0 * gulp_t) * gulp_t) * np.exp(-gulp_t * 22.0) * 0.52
              l = np.tanh((sub * env * 0.72 + wind_l * env * 0.55 + gulp) * 1.1) * edge_fade(n, 0.008, 0.07)
              r = np.tanh((sub * env * 0.72 + wind_r * env * 0.55 + gulp) * 1.1) * edge_fade(n, 0.008, 0.07)
              save_wav("blackhole.wav", l, r)

          def make_check_sound():
              dur = 0.85
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              p1 = (
                  np.sin(TAU * 293.66 * t) * 0.48
                  + np.sin(TAU * 440.00 * t) * 0.34
                  + np.sin(TAU * 587.33 * t) * 0.18
              ) * np.exp(-t * 4.5) * smooth(0.0, 0.012, t)
              t2 = np.maximum(0.0, t - 0.14)
              p2 = (t > 0.14) * (
                  np.sin(TAU * 349.23 * t2) * 0.45
                  + np.sin(TAU * 523.25 * t2) * 0.34
                  + np.sin(TAU * 698.46 * t2) * 0.22
                  + np.sin(TAU * 1046.5 * t2) * 0.10
              ) * np.exp(-t2 * 3.8) * smooth(0.0, 0.012, t2)
              sub = np.sin(TAU * 73.42 * t) * np.exp(-t * 3.5) * 0.32 * smooth(0.0, 0.015, t)
              l = (p1 + p2 * 0.95 + sub) * edge_fade(n, 0.005, 0.09) * 0.85
              r = (np.roll(p1, 140) * 0.9 + p2 + sub) * edge_fade(n, 0.005, 0.09) * 0.85
              save_wav("check.wav", l, r)

          def make_win_sound():
              dur = 2.30
              n = int(SR * dur)
              t = np.arange(n, dtype=np.float64) / SR
              notes = [(0.00, 293.66), (0.13, 369.99), (0.26, 440.00), (0.39, 587.33), (0.54, 659.25), (0.70, 880.00)]
              l = np.zeros(n, dtype=np.float64)
              r = np.zeros(n, dtype=np.float64)
              for idx, (st, f) in enumerate(notes):
                  dt = np.maximum(0.0, t - st)
                  active = (t >= st)
                  env = active * smooth(0.0, 0.015, dt) * np.exp(-dt * 2.1)
                  voice = (
                      np.sin(TAU * f * dt) * 0.55
                      + np.sin(TAU * f * 2.0 * dt) * 0.22 * np.exp(-dt * 3.0)
                      + np.sin(TAU * f * 0.5 * dt) * 0.28
                  ) * env
                  pan = 0.35 + 0.30 * (idx / max(1, len(notes) - 1))
                  l += voice * (1.0 - pan)
                  r += voice * pan
              pad_env = smooth(0.04, 0.45, t) * np.exp(-np.maximum(0.0, t - 0.6) * 1.45)
              pad = (
                  np.sin(TAU * 73.42 * t) * 0.35
                  + np.sin(TAU * 146.83 * t) * 0.30
                  + np.sin(TAU * 220.00 * t) * 0.22
                  + np.sin(TAU * 369.99 * t) * 0.16
              ) * pad_env
              l = (l + pad + np.roll(r, int(0.18 * SR)) * 0.25) * edge_fade(n, 0.006, 0.22) * 0.75
              r = (r + pad + np.roll(l, int(0.24 * SR)) * 0.25) * edge_fade(n, 0.006, 0.22) * 0.75
              save_wav("win.wav", l, r)

          def make_ambient_music():
              T = 48.0
              n = int(SR * T)
              u = np.arange(n, dtype=np.float64) / n
              t = u * T

              def pad_voice(freq, pan=0.5, detune_k=1):
                  k0 = max(1, int(round(freq * T)))
                  ph0 = TAU * k0 * u
                  ph1 = TAU * (k0 + detune_k) * u
                  ph2 = TAU * max(1, k0 - detune_k) * u
                  vl = (
                      np.sin(ph0) * 0.48
                      + np.sin(ph1) * 0.28
                      + np.sin(ph0 * 2.0) * (0.14 + 0.06 * np.sin(TAU * 2.0 * u))
                      + np.sin(ph0 * 3.0) * 0.04
                  )
                  vr = (
                      np.sin(ph0 + 0.4) * 0.48
                      + np.sin(ph2 + 0.7) * 0.28
                      + np.sin(ph0 * 2.0 + 0.2) * (0.14 + 0.06 * np.cos(TAU * 2.0 * u))
                      + np.sin(ph0 * 3.0) * 0.04
                  )
                  return vl * (1.0 - pan), vr * pan

              chords = [
                  (6.0,  [(73.42, 0.50), (146.83, 0.45), (220.00, 0.55), (261.63, 0.35), (329.63, 0.65), (349.23, 0.48)]),
                  (18.0, [(58.27, 0.50), (116.54, 0.55), (174.61, 0.42), (220.00, 0.62), (293.66, 0.38), (349.23, 0.52)]),
                  (30.0, [(98.00, 0.50), (196.00, 0.44), (233.08, 0.58), (293.66, 0.40), (349.23, 0.64), (440.00, 0.46)]),
                  (42.0, [(55.00, 0.50), (110.00, 0.54), (164.81, 0.40), (196.00, 0.60), (246.94, 0.36), (329.63, 0.52)]),
              ]

              L = np.zeros(n, dtype=np.float64)
              R = np.zeros(n, dtype=np.float64)
              for center, notes in chords:
                  d = np.abs(((t - center + T * 0.5) % T) - T * 0.5)
                  w = np.clip(1.0 - d / 9.0, 0.0, 1.0)
                  w = w * w * (3.0 - 2.0 * w)
                  cL = np.zeros(n, dtype=np.float64)
                  cR = np.zeros(n, dtype=np.float64)
                  for idx, (freq, pan) in enumerate(notes):
                      vl, vr = pad_voice(freq, pan=pan, detune_k=1 + (idx % 2))
                      wt = 0.28 if idx == 0 else 0.16
                      cL += vl * wt
                      cR += vr * wt
                  L += cL * w
                  R += cR * w

              breath = 0.85 + 0.15 * np.sin(TAU * 3.0 * u)
              L *= breath
              R *= breath

              chimes = [
                  (3.0,  587.33, 0.30), (9.5,  659.25, 0.72), (16.0, 523.25, 0.28),
                  (22.0, 880.00, 0.68), (28.5, 587.33, 0.35), (34.0, 698.46, 0.74),
                  (40.5, 659.25, 0.32),
              ]
              for st, freq, pan in chimes:
                  for echo, gain in ((0.0, 0.11), (0.42, 0.055), (0.84, 0.025)):
                      dt = t - (st + echo)
                      mask = (dt >= 0.0) & (dt < 6.2)
                      if not np.any(mask):
                          continue
                      tt = dt[mask]
                      env = smooth(0.0, 0.025, tt) * np.exp(-tt * 1.45) * (1.0 - smooth(5.2, 6.2, tt))
                      tone = (np.sin(TAU * freq * tt) + 0.25 * np.sin(TAU * freq * 2.0 * tt) * np.exp(-tt * 2.2)) * env * gain
                      ep = pan if echo == 0.0 else (1.0 - pan if echo < 0.6 else pan)
                      L[mask] += tone * (1.0 - ep)
                      R[mask] += tone * ep

              wind_l = band_noise(n, 45, 290, 201) * (0.045 + 0.025 * np.sin(TAU * 2.0 * u))
              wind_r = band_noise(n, 48, 310, 202) * (0.045 + 0.025 * np.cos(TAU * 2.0 * u))
              L = np.tanh((L + wind_l) * 0.85)
              R = np.tanh((R + wind_r) * 0.85)
              save_wav("ambient.wav", L, R)

          print("Sounds...")
          make_move_sound()
          make_capture_sound()
          make_blackhole_sound()
          make_select_sound()
          make_click_sound()
          make_check_sound()
          make_win_sound()
          make_ambient_music()
          print("Audio done")

          EOF
          ./.venv/bin/python gen_assets.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cat << 'EOF' > project.yml
          name: VibeChess
          options:
            bundleIdPrefix: com.vibe
          targets:
            VibeChess:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: "Камера необходима для режима AR."
                  DEBUG_INFORMATION_FORMAT: dwarf
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate

      - name: Build app (Release)
        run: |
          xcodebuild -project VibeChess.xcodeproj -scheme VibeChess -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            clean build CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/VibeChess.app Payload/
          zip -r VibeChess.ipa Payload

      - name: Publish Public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v7.0.${{ github.run_number }}"
          gh release create "$VERSION" VibeChess.ipa \
            --title "VibeChess $VERSION (4K PBR + Fixed Sun Shader)" \
            --notes "Версия 7.0:
            - Исправлен Metal-шейдер Солнца (scn_frame.time) и баланс HDR-экспозиции
            - 4K текстуры орехового дерева, итальянского мрамора, белых и чёрных фигур, космоса и Земли
            - Двойные мягкие тени, 20 объёмных лучей света, RTX-отблески на доске и золоте
            - Усиленные взрывы и столкновения метеоритов с двойной ударной волной
            - Режим 3D-физики рук (перенос/сбивание фигур) и гироскоп в настройках"
