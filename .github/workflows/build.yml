name: Build IPA & Release
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Generate High-Res Textures, Icon & Audio
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset

          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF

          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024",
                "filename" : "icon_1024.png"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          # 1. Генерация 2K текстур дерева и мрамора
          python3 - << 'EOF'
          import math, random

          # Текстура темного дерева 1024x1024
          w, h = 1024, 1024
          wood_ppm = f'P6\n{w} {h}\n255\n'.encode('ascii') + bytearray(w * h * 3)
          pixels = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  grain = math.sin(x * 0.05 + math.sin(y * 0.02) * 5.0) * 20.0
                  noise = random.randint(-8, 8)
                  base = 35 + grain + noise
                  pixels[idx] = max(0, min(255, int(base * 1.2)))
                  pixels[idx+1] = max(0, min(255, int(base * 0.8)))
                  pixels[idx+2] = max(0, min(255, int(base * 0.5)))
          with open('wood.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels)

          # Текстура белого мрамора 1024x1024
          pixels_m = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  vein = abs(math.sin(x * 0.015 + y * 0.02 + math.sin(x * 0.03) * 3.0))
                  val = 210 + vein * 40 + random.randint(-5, 5)
                  pixels_m[idx] = max(0, min(255, int(val)))
                  pixels_m[idx+1] = max(0, min(255, int(val * 0.98)))
                  pixels_m[idx+2] = max(0, min(255, int(val * 0.94)))
          with open('marble.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels_m)

          # Иконка приложения 1024x1024
          pixels_icon = bytearray(w * h * 3)
          for y in range(h):
              for x in range(w):
                  idx = (y * w + x) * 3
                  nx, ny = (x - 512)/512.0, (y - 512)/512.0
                  dist = math.sqrt(nx*nx + ny*ny)
                  r = int(max(0, 15 - dist * 10))
                  g = int(max(0, 22 + (1.0 - dist) * 35))
                  b = int(max(0, 48 + (1.0 - dist) * 75))
                  dx = abs(x - 512)
                  if (760 <= y <= 820 and dx < 170) or (620 <= y < 760 and dx < 75) or (410 <= y < 620 and dx < 52) or ((x-512)**2 + (y-360)**2 < 70**2) or (220 <= y <= 310 and dx < 18) or (245 <= y <= 275 and dx < 50):
                      f = 1.0 - (y - 220)/600.0
                      r, g, b = 255, int(185 + f*60), int(45 + f*50)
                  pixels_icon[idx] = max(0, min(255, r))
                  pixels_icon[idx+1] = max(0, min(255, g))
                  pixels_icon[idx+2] = max(0, min(255, b))
          with open('temp_icon.ppm', 'wb') as f:
              f.write(f'P6\n{w} {h}\n255\n'.encode('ascii') + pixels_icon)
          EOF

          sips -s format png wood.ppm --out Sources/wood_texture.png
          sips -s format png marble.ppm --out Sources/marble_texture.png
          sips -s format png temp_icon.ppm --out Sources/Assets.xcassets/AppIcon.appiconset/icon_1024.png
          rm *.ppm

          # Генерация чистых WAV звуков
          python3 - << 'EOF'
          import wave, struct, math, random
          def create_wav(filename, duration, gen):
              rate = 44100
              with wave.open(filename, 'w') as w:
                  w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
                  frames = bytearray()
                  for i in range(int(rate * duration)):
                      t = float(i) / rate
                      l, r = gen(t, i)
                      frames.extend(struct.pack('<hh', max(-32767, min(32767, int(l * 32767))), max(-32767, min(32767, int(r * 32767)))))
                  w.writeframes(frames)
          create_wav("Sources/ambient.wav", 120.0, lambda t, i: (math.sin(2*math.pi*55.0*t)*0.25, math.sin(2*math.pi*82.4*t)*0.2))
          create_wav("Sources/move.wav", 0.35, lambda t, i: (math.sin(2*math.pi*140.0*t)*math.exp(-t*28.0)*0.85, math.sin(2*math.pi*140.0*t)*math.exp(-t*28.0)*0.85))
          create_wav("Sources/capture.wav", 0.6, lambda t, i: ((math.sin(2*math.pi*85.0*t)+(random.random()*2-1)*0.35)*math.exp(-t*12.0), (math.sin(2*math.pi*85.0*t)+(random.random()*2-1)*0.35)*math.exp(-t*12.0)))
          create_wav("Sources/select.wav", 0.12, lambda t, i: (math.sin(2*math.pi*880.0*t)*math.exp(-t*50.0)*0.7, math.sin(2*math.pi*880.0*t)*math.exp(-t*50.0)*0.7))
          create_wav("Sources/alarm.wav", 1.2, lambda t, i: (math.sin(2*math.pi*(950.0 if int(t*8)%2==0 else 600.0)*t)*0.75, math.sin(2*math.pi*(950.0 if int(t*8)%2==0 else 600.0)*t)*0.75))
          create_wav("Sources/laser.wav", 0.5, lambda t, i: (math.sin(2*math.pi*(1500.0 - t*2600.0)*t)*math.exp(-t*5.0)*0.85, math.sin(2*math.pi*(1500.0 - t*2600.0)*t)*math.exp(-t*5.0)*0.85))
          EOF

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          cat << 'EOF' > project.yml
          name: VibeChess
          options:
            bundleIdPrefix: com.vibe
          targets:
            VibeChess:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_NSCameraUsageDescription: "Камера необходима для размещения 3D-шахмат на столе в дополненной реальности (AR)."
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' VibeChess.xcodeproj/project.pbxproj

      - name: Build App
        run: |
          xcodebuild -project VibeChess.xcodeproj -scheme VibeChess -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/VibeChess.app Payload/
          zip -r VibeChess.ipa Payload

      - name: Publish Public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.2.${{ github.run_number }}"
          gh release create "$VERSION" VibeChess.ipa \
            --title "VibeChess $VERSION (AR + Slots + Textures)" \
            --notes "🚀 Глобальное обновление:
            - Настоящий AR-режим на столе с определением поверхности
            - Система множественных сохранений (Слоты 1, 2, 3 + Автосейв)
            - 2K-текстуры дерева и мрамора
            - Орбитальный лазер со световой вспышкой и искрами"
