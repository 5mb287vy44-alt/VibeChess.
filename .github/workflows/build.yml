name: Build WAVE IPA & Release
on:
  push:
    paths:
      - 'Sources/App.swift'
  workflow_dispatch:

concurrency:
  group: build-wave
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
          xcodebuild -version

      - name: Download three.js
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o Sources/three.min.js
          ls -la Sources

      - name: Generate App Icon
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > Sources/Assets.xcassets/Contents.json
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat << 'EOF' > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          { "images" : [ { "idiom" : "universal", "platform" : "ios", "size" : "1024x1024", "filename" : "icon_1024.png" } ], "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          python3 - << 'EOF'
          import math
          w = 1024
          px = bytearray(w * w * 3)
          for y in range(w):
              for x in range(w):
                  d = math.hypot(x - 512, y - 512)
                  i = (y * w + x) * 3
                  r, g, b = 10, 10, 14
                  if y % 14 < 3:
                      r, g, b = 4, 4, 6
                  glow = max(0.0, 1.0 - d / 430.0)
                  r += int(120 * glow * glow)
                  if d < 190:
                      r, g, b = 215, 25, 25
                  px[i] = min(255, r); px[i+1] = min(255, g); px[i+2] = min(255, b)
          open('icon.ppm', 'wb').write(f'P6\n{w} {w}\n255\n'.encode() + px)
          EOF
          sips -s format png icon.ppm --out Sources/Assets.xcassets/AppIcon.appiconset/icon_1024.png
          rm icon.ppm

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          cat << 'EOF' > project.yml
          name: Wave
          options:
            bundleIdPrefix: com.vibe
          targets:
            Wave:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - Sources
              settings:
                base:
                  SWIFT_VERSION: "5.0"
                  SWIFT_OPTIMIZATION_LEVEL: "-O"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "WAVE"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIStatusBarHidden: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Wave.xcodeproj/project.pbxproj

      - name: Build App (Release)
        run: |
          xcodebuild -project Wave.xcodeproj -scheme Wave -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Create IPA
        run: |
          mkdir -p Payload
          mv build/Wave.app Payload/
          zip -r Wave.ipa Payload

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" Wave.ipa \
            --title "WAVE $VERSION" \
            --notes "WAVE: интерактивное кино, техно-демо"
